<main class="lobby">
  <div class="intro">
    <p class="eyebrow">THE FC ARCADE</p>
    <h1>红白机游戏厅<span aria-hidden="true">.</span></h1>
    <p class="subtitle">从游戏目录选一款经典作品，开始游玩。</p>
  </div>
  <section aria-labelledby="games-title">
    <div class="section-heading">
      <h2 id="games-title">游戏目录</h2>
      <span>{{ games.length }} 款可玩</span>
    </div>
    <div class="catalog">
      <template each="game of games" key="game.id">
        <article class="game-card">
          <div class="cover">
            <img :src="game.cover" alt="" width="512" height="256">
            <span class="card-index">FC / {{ game.number }}</span>
          </div>
          <div class="card-body">
            <p class="metadata">{{ game.genre }} <span>·</span> {{ game.year }}</p>
            <p class="english-title">{{ game.originalTitle }}</p>
            <h3>{{ game.title }}</h3>
            <p class="summary">{{ game.summary }}</p>
            <route-link :to="game.target"><template slot="default">开始游戏<span class="link-context">：{{ game.title }}</span> <span aria-hidden="true">→</span></template></route-link>
          </div>
        </article>
      </template>
    </div>
  </section>
</main>
